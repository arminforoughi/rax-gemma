<!doctype html>
<!-- Talk to the arm: Gemma 4, on this machine, answers from what the wrist camera sees and
     moves the arm only when you ask it to. Served by the pick server at /ui/chat.html. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAX chat</title>
<style>
  :root { --bg:#0e1117; --panel:#161b24; --line:#262d3a; --ink:#eef1f6; --muted:#8f99aa;
    --you:#2f6fd6; --gemma:#232a38; --gemma-ink:#e9e3ff; --accent:#8b6cf0; --stop:#e5484d; --ok:#3ecf8e; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display:grid; grid-template-columns:minmax(340px, 1fr) minmax(320px, 520px); gap:16px;
    height:100%; padding:16px; max-width:1300px; margin:0 auto; }
  .chatcol { display:flex; flex-direction:column; min-height:0; background:var(--panel);
    border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  header { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; font-weight:650; letter-spacing:-.01em; }
  .badge { font-size:12px; color:var(--gemma-ink); background:#2a2342; border:1px solid #3d3363;
    padding:2px 9px; border-radius:999px; white-space:nowrap; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--ok); flex:none; }
  .dot.busy { background:#f5b84b; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  .spacer { flex:1; }
  .link { color:var(--muted); font-size:13px; text-decoration:none; }
  .link:hover { color:var(--ink); }
  #msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .m { max-width:82%; padding:9px 13px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .m.you { align-self:flex-end; background:var(--you); color:#fff; border-bottom-right-radius:4px; }
  .m.gemma { align-self:flex-start; background:var(--gemma); color:var(--gemma-ink); border-bottom-left-radius:4px; }
  .m.arm { align-self:center; max-width:92%; background:none; color:var(--muted); font-size:13px;
    font-family:ui-monospace, Menlo, monospace; padding:2px 6px; text-align:center; }
  .m .t { display:block; font-size:11px; opacity:.55; margin-top:2px; }
  .typing { align-self:flex-start; color:var(--muted); font-size:13px; padding:0 4px; min-height:1.2em; }
  .empty { margin:auto; text-align:center; color:var(--muted); max-width:360px; }
  .empty b { color:var(--ink); display:block; font-size:16px; margin-bottom:4px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; padding:0 16px 10px; }
  .chip { font:inherit; font-size:13px; color:var(--ink); background:#1d2330; border:1px solid var(--line);
    border-radius:999px; padding:5px 11px; cursor:pointer; }
  .chip:hover { border-color:var(--accent); }
  form { display:flex; gap:8px; padding:12px 16px 16px; border-top:1px solid var(--line); }
  #text { flex:1; min-width:0; font:inherit; font-size:16px; color:var(--ink); background:#0f131b;
    border:1px solid var(--line); border-radius:12px; padding:11px 13px; }
  #text:focus { outline:none; border-color:var(--accent); }
  button { font:inherit; border:0; border-radius:12px; padding:0 16px; cursor:pointer; font-weight:600; }
  #send { background:var(--accent); color:#fff; }
  #send:disabled { opacity:.45; cursor:default; }
  #stop { background:var(--stop); color:#fff; }
  .side { display:flex; flex-direction:column; gap:12px; min-height:0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .card p { margin:0; padding:8px 12px; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .cam img { display:block; width:100%; aspect-ratio:4/3; object-fit:contain; background:#000; }
  .v3 { flex:1; min-height:240px; display:flex; flex-direction:column; }
  #v3d { flex:1; width:100%; min-height:220px; display:block; touch-action:none; }
  .status { padding:10px 12px; font-size:13px; color:var(--muted); border-top:1px solid var(--line); }
  .status b { color:var(--ink); font-weight:650; }
  @media (max-width:820px) { .app { grid-template-columns:1fr; height:auto; } .chatcol { height:70vh; } .v3 { display:none; } }
</style>
</head>
<body>
<div class="app">
  <section class="chatcol">
    <header>
      <span class="dot" id="dot"></span>
      <h1>Talk to the arm</h1>
      <span class="badge">Gemma 4 · on this machine · no cloud</span>
      <span class="spacer"></span>
      <a class="link" href="/" title="The full control panel">panel</a>
      <a class="link" href="#" id="clear" title="Clear the conversation">clear</a>
    </header>
    <div id="msgs"></div>
    <div class="typing" id="typing"></div>
    <div class="chips" id="chips"></div>
    <form id="f">
      <input id="text" autocomplete="off" maxlength="300" placeholder="Ask, or tell it what to do">
      <button id="send" type="submit">Send</button>
      <button id="stop" type="button" title="Stop the arm now">Stop</button>
    </form>
  </section>
  <aside class="side">
    <div class="card cam"><p>Wrist camera</p><img src="/stream" alt="what the arm sees"></div>
    <div class="card v3"><p>Robot · 3D · drag to rotate</p><canvas id="v3d"></canvas>
      <div class="status" id="status">connecting</div></div>
  </aside>
</div>
<script src="/ui/viewer3d.js"></script>
<script>
const $ = id => document.getElementById(id);
let places = [], shown = -1, busy = false;
const SUGGEST = () => [
  'What do you see?',
  'How many things could you pick up?',
  places[0] ? `Put the red cube in the ${places[0]}` : 'Pick up the red cube',
  places[1] ? `Sort by colour: blue to the ${places[0]}, the rest to the ${places[1]}` : null,
].filter(Boolean);

function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function render(msgs){
  const box = $('msgs');
  if (!msgs.length){
    box.innerHTML = '<div class="empty"><b>Say hello to the arm.</b>Ask what it sees, or tell it '
      + 'what to move and where. It answers from the wrist camera and only moves when you ask.</div>';
    shown = 0; return;
  }
  if (msgs.length === shown) return;
  const atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.innerHTML = msgs.map(m => `<div class="m ${m.who}">${esc(m.text)}${m.who === 'arm' ? '' : `<span class="t">${m.t}</span>`}</div>`).join('');
  if (atEnd || msgs.length > shown) box.scrollTop = box.scrollHeight;
  shown = msgs.length;
}
function chips(){
  $('chips').innerHTML = SUGGEST().map(s => `<button class="chip" type="button">${esc(s)}</button>`).join('');
  for (const b of $('chips').children) b.onclick = () => say(b.textContent);
}
async function poll(){
  try {
    const d = await (await fetch('/chat')).json();
    if (JSON.stringify(d.places) !== JSON.stringify(places)){ places = d.places || []; chips(); }
    render(d.msgs || []);
    busy = !!d.running;
    $('dot').className = 'dot' + (busy ? ' busy' : '');
    $('send').disabled = busy;
    $('typing').textContent = busy ? (d.detail ? `Gemma is ${/look|think/i.test(d.detail) ? d.detail.replace(/^\w/, c => c.toLowerCase()) : 'working: ' + d.detail}...` : 'Gemma is working...') : '';
    $('status').innerHTML = `<b>${esc(d.phase || '—')}</b> ${esc(d.detail || '')}` + (places.length ? `<br>places: ${esc(places.join(', '))}` : '');
  } catch (e) { $('status').textContent = 'server not reachable'; }
}
async function say(text){
  text = (text || '').trim(); if (!text || busy) return;
  $('text').value = '';
  const r = await fetch('/chat?text=' + encodeURIComponent(text), {method:'POST'}).then(r => r.json()).catch(() => ({ok:false, reason:'server not reachable'}));
  if (r.ok === false) alert(r.reason || r.error || 'not sent');
  poll();
}
$('f').onsubmit = e => { e.preventDefault(); say($('text').value); };
$('stop').onclick = () => fetch('/stop', {method:'POST'}).then(poll);
$('clear').onclick = e => { e.preventDefault(); fetch('/chat/clear', {method:'POST'}).then(() => { shown = -1; poll(); }); };
chips(); poll(); setInterval(poll, 700); $('text').focus();
</script>
</body>
</html>
